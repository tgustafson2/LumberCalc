openapi: 3.0.3
info:
  title: LumberCalc API
  version: 0.0.0
  description: >
    Paths under /v1 require a bearer session.
    This includes a path that has no operation.
    A request under /v1 with no session returns 401.
    A request under /v1 with a session and no operation returns 404.
    /healthz and /readyz do not require a session.
servers:
  - url: /
tags:
  - name: probes
  - name: v1
security:
  - bearer: []
paths:
  /healthz:
    get:
      operationId: getHealth
      tags: [probes]
      security: []
      responses:
        "200":
          description: The process is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "500":
          description: The process panicked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /readyz:
    get:
      operationId: getReadiness
      tags: [probes]
      security: []
      responses:
        "200":
          description: Every probe succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyOk"
        "503":
          description: A probe failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyFailed"
        "500":
          description: The process panicked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/me:
    get:
      operationId: getMe
      tags: [v1]
      responses:
        "200":
          description: The signed-in user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          description: The request has no valid session.
          headers:
            WWW-Authenticate:
              required: true
              schema:
                type: string
                enum: [Bearer]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The session check or the user row failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/designs:
    post:
      operationId: createDesign
      tags: [v1]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDesignRequest"
      responses:
        "201":
          description: The design was created.
          headers:
            Location:
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Design"
        "400":
          description: The name or the document is not valid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: The request has no valid session.
          headers:
            WWW-Authenticate:
              required: true
              schema:
                type: string
                enum: [Bearer]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The document names a material that does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The design was not saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      operationId: listDesigns
      tags: [v1]
      responses:
        "200":
          description: The caller's live designs, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DesignSummary"
        "401":
          description: The request has no valid session.
          headers:
            WWW-Authenticate:
              required: true
              schema:
                type: string
                enum: [Bearer]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The designs were not loaded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/designs/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getDesign
      tags: [v1]
      responses:
        "200":
          description: The design, including its document.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Design"
        "401":
          description: The request has no valid session.
          headers:
            WWW-Authenticate:
              required: true
              schema:
                type: string
                enum: [Bearer]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: The caller has no such design.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The design was not loaded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      operationId: replaceDesign
      tags: [v1]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceDesignRequest"
      responses:
        "200":
          description: The design was replaced.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Design"
        "400":
          description: The name, the document, or the version is not valid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: The request has no valid session.
          headers:
            WWW-Authenticate:
              required: true
              schema:
                type: string
                enum: [Bearer]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: The caller has no such design.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A version that does not match sets error to stale version and leaves the row unchanged. A missing material sets error to conflict.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The design was not saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteDesign
      tags: [v1]
      responses:
        "204":
          description: The design was deleted.
        "401":
          description: The request has no valid session.
          headers:
            WWW-Authenticate:
              required: true
              schema:
                type: string
                enum: [Bearer]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: The caller has no such design.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The design was not deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/designs/{id}/copy:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: copyDesign
      tags: [v1]
      responses:
        "201":
          description: The design was copied.
          headers:
            Location:
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Design"
        "400":
          description: The request has a body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: The request has no valid session.
          headers:
            WWW-Authenticate:
              required: true
              schema:
                type: string
                enum: [Bearer]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: The caller has no such design.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The document names a material that does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The design was not copied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/materials:
    post:
      operationId: createMaterial
      tags: [v1]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaterialWrite"
      responses:
        "201":
          description: The material was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Material"
        "400":
          description: The name or an inch field is not valid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: The request has no valid session.
          headers:
            WWW-Authenticate:
              required: true
              schema:
                type: string
                enum: [Bearer]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The caller already has a material with this name. The error is name already used.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The material was not saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      operationId: listMaterials
      tags: [v1]
      responses:
        "200":
          description: System materials and the caller's materials, ordered by name.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Material"
        "401":
          description: The request has no valid session.
          headers:
            WWW-Authenticate:
              required: true
              schema:
                type: string
                enum: [Bearer]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The materials were not loaded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/materials/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: replaceMaterial
      tags: [v1]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaterialWrite"
      responses:
        "200":
          description: The material was replaced.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Material"
        "400":
          description: The name or an inch field is not valid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: The request has no valid session.
          headers:
            WWW-Authenticate:
              required: true
              schema:
                type: string
                enum: [Bearer]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The material is a system row or is owned by someone else.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No material has this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The caller already has a material with this name. The error is name already used.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The material was not saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteMaterial
      tags: [v1]
      responses:
        "204":
          description: The material was deleted.
        "401":
          description: The request has no valid session.
          headers:
            WWW-Authenticate:
              required: true
              schema:
                type: string
                enum: [Bearer]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The material is a system row or is owned by someone else.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No material has this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A price or a design usage references the material. The error is material in use.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The material was not deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/prices:
    post:
      operationId: createPrice
      tags: [v1]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PriceCreate"
      responses:
        "201":
          description: The price was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Price"
        "400":
          description: The body, the material id, the length, or the cents are not valid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: The request has no valid session.
          headers:
            WWW-Authenticate:
              required: true
              schema:
                type: string
                enum: [Bearer]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The error is price already exists or material not available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The price was not saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      operationId: listPrices
      tags: [v1]
      responses:
        "200":
          description: The caller's prices, ordered by material, length, and id.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Price"
        "401":
          description: The request has no valid session.
          headers:
            WWW-Authenticate:
              required: true
              schema:
                type: string
                enum: [Bearer]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The prices were not loaded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/prices/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: updatePrice
      tags: [v1]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PriceUpdate"
      responses:
        "200":
          description: The price was updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Price"
        "400":
          description: The cents are not valid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: The request has no valid session.
          headers:
            WWW-Authenticate:
              required: true
              schema:
                type: string
                enum: [Bearer]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No price has this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The price was not saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deletePrice
      tags: [v1]
      responses:
        "204":
          description: The price was deleted.
        "401":
          description: The request has no valid session.
          headers:
            WWW-Authenticate:
              required: true
              schema:
                type: string
                enum: [Bearer]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No price has this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The price was not deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    ReadyOk:
      type: object
      additionalProperties: false
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ready]
        checks:
          type: array
          items:
            $ref: "#/components/schemas/ReadinessCheck"
    ReadyFailed:
      type: object
      additionalProperties: false
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [not_ready]
        checks:
          type: array
          items:
            $ref: "#/components/schemas/ReadinessCheck"
    ReadinessCheck:
      type: object
      additionalProperties: false
      required: [name, ok]
      properties:
        name:
          type: string
          minLength: 1
        ok:
          type: boolean
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
          minLength: 1
    Me:
      type: object
      additionalProperties: false
      required: [user_id, clerk_user_id, display_name]
      properties:
        user_id:
          type: string
          minLength: 1
        clerk_user_id:
          type: string
          minLength: 1
          maxLength: 64
        display_name:
          type: string
          minLength: 1
    CreateDesignRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          description: The server removes leading and trailing whitespace. A blank result is rejected.
        description:
          type: string
        document:
          $ref: "#/components/schemas/DesignDocument"
    ReplaceDesignRequest:
      type: object
      additionalProperties: false
      required: [name, document, version]
      properties:
        name:
          type: string
          minLength: 1
          description: The server removes leading and trailing whitespace. A blank result is rejected.
        description:
          type: string
        document:
          $ref: "#/components/schemas/DesignDocument"
        version:
          type: integer
          minimum: 1
          description: The designs.version value from the last read. The server compares this integer. A match stores version plus 1.
    DesignSummary:
      type: object
      additionalProperties: false
      required: [id, name, description, version, updatedAt]
      properties:
        id:
          type: string
          format: uuid
          x-go-type: string
        name:
          type: string
          minLength: 1
        description:
          type: string
        version:
          type: integer
          minimum: 1
        updatedAt:
          type: string
          format: date-time
    Design:
      type: object
      additionalProperties: false
      required: [id, name, description, version, updatedAt, document]
      properties:
        id:
          type: string
          format: uuid
          x-go-type: string
        name:
          type: string
          minLength: 1
        description:
          type: string
        version:
          type: integer
          minimum: 1
        updatedAt:
          type: string
          format: date-time
        document:
          $ref: "#/components/schemas/DesignDocument"
    DesignDocument:
      x-go-type: store.Document
      x-go-type-import:
        path: lumbercalc/backend/internal/store
      description: A design at schema version 1. Lengths are inches. Rotation is Euler XYZ in degrees.
      type: object
      additionalProperties: false
      required: [schemaVersion, units, pieces, connections]
      properties:
        schemaVersion:
          type: integer
          enum: [1]
        units:
          type: string
          enum: [in]
        pieces:
          type: array
          items:
            $ref: "#/components/schemas/DesignPiece"
        connections:
          type: array
          items:
            $ref: "#/components/schemas/DesignConnection"
    DesignPiece:
      type: object
      additionalProperties: false
      required: [id, name, materialId, lengthIn, continuity, transform]
      properties:
        id:
          $ref: "#/components/schemas/DocumentUuid"
        name:
          type: string
        materialId:
          $ref: "#/components/schemas/DocumentUuid"
        roughCut:
          type: boolean
          default: false
        lengthIn:
          type: number
          description: Exact inch length. The numeric value stays exact. An exponent form can come back as a plain decimal.
        continuity:
          $ref: "#/components/schemas/DesignContinuity"
        transform:
          $ref: "#/components/schemas/DesignTransform"
    DesignContinuity:
      type: object
      additionalProperties: false
      required: [x, y, z]
      description: One flag per local axis. True means that axis stays one board. False means the solver may splice.
      properties:
        x:
          type: boolean
        y:
          type: boolean
        z:
          type: boolean
    DesignTransform:
      type: object
      additionalProperties: false
      required: [positionIn, rotationDeg]
      properties:
        positionIn:
          type: array
          minItems: 3
          maxItems: 3
          items:
            type: number
          description: Inches, in axis order x, y, z.
        rotationDeg:
          type: array
          minItems: 3
          maxItems: 3
          items:
            type: number
          description: Euler angles in degrees, applied in X, then Y, then Z order.
    DesignConnection:
      type: object
      additionalProperties: false
      required: [id, pieceAId, pieceBId, joinType, faceA, faceB, wasteIn]
      properties:
        id:
          type: string
          minLength: 1
        pieceAId:
          $ref: "#/components/schemas/DocumentUuid"
        pieceBId:
          $ref: "#/components/schemas/DocumentUuid"
        joinType:
          type: string
          enum: [butt, lap, fastener]
        faceA:
          type: string
          minLength: 1
        faceB:
          type: string
          minLength: 1
        wasteIn:
          type: number
          description: Exact inches. The numeric value stays exact. An exponent form can come back as a plain decimal.
    DocumentUuid:
      description: A client-generated UUID. Unique among piece ids in one document. It is not a database key.
      type: string
      format: uuid
    Inches:
      type: number
      minimum: 0
      exclusiveMinimum: true
      x-go-type: json.Number
      x-go-type-import:
        path: encoding/json
        name: Number
      description: Exact inches. The numeric value stays exact. An exponent form can come back as a plain decimal.
    MaterialWrite:
      type: object
      additionalProperties: false
      required:
        - name
        - nominalThicknessIn
        - nominalWidthIn
        - actualThicknessIn
        - actualWidthIn
        - roughThicknessIn
        - roughWidthIn
      properties:
        name:
          type: string
          minLength: 1
          description: The server removes leading and trailing whitespace. A blank result is rejected.
        species:
          type: string
          nullable: true
        grade:
          type: string
          nullable: true
        nominalThicknessIn:
          $ref: "#/components/schemas/Inches"
        nominalWidthIn:
          $ref: "#/components/schemas/Inches"
        actualThicknessIn:
          $ref: "#/components/schemas/Inches"
        actualWidthIn:
          $ref: "#/components/schemas/Inches"
        roughThicknessIn:
          $ref: "#/components/schemas/Inches"
        roughWidthIn:
          $ref: "#/components/schemas/Inches"
    Material:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - species
        - grade
        - system
        - nominalThicknessIn
        - nominalWidthIn
        - actualThicknessIn
        - actualWidthIn
        - roughThicknessIn
        - roughWidthIn
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          x-go-type: string
        name:
          type: string
          minLength: 1
        species:
          type: string
          nullable: true
        grade:
          type: string
          nullable: true
        system:
          type: boolean
        nominalThicknessIn:
          $ref: "#/components/schemas/Inches"
        nominalWidthIn:
          $ref: "#/components/schemas/Inches"
        actualThicknessIn:
          $ref: "#/components/schemas/Inches"
        actualWidthIn:
          $ref: "#/components/schemas/Inches"
        roughThicknessIn:
          $ref: "#/components/schemas/Inches"
        roughWidthIn:
          $ref: "#/components/schemas/Inches"
        updatedAt:
          type: string
          format: date-time
    Cents:
      type: integer
      minimum: 0
      maximum: 2147483647
